# FortiSafe Antivírus — derivado do Hypatia. Este workflow constrói e publica
# APENAS neste repositório; nunca no upstream.
#
# CI de integração: build de debug, lint, testes de unidade (JVM), SBOM e
# checksums. Não assina nada, não cria release, não toca em outro repositório.
#
# Memória do sistema (por que está assim — 16/09/2026):
# - `permissions: contents: read` no nível do workflow. O arquivo herdado do
#   upstream dava ao token permissão total de escrita em tudo; nenhum passo
#   daqui escreve no repositório.
# - Toda action é fixada pelo SHA completo do commit da tag, com a versão em
#   comentário (`# vX.Y.Z`). Tag é mutável; SHA não. O Dependabot
#   (.github/dependabot.yml) atualiza SHA e comentário juntos.
# - `persist-credentials: false` no checkout: o build executa plugins Gradle
#   (código de terceiros) e não precisa de token git; assim nenhum token fica
#   acessível no workspace durante o build.
# - `-DskipFormatKtlint`, herdado do upstream, foi REMOVIDO: não existe plugin
#   ktlint nem leitura dessa propriedade em nenhum arquivo de build deste
#   repositório (conferido em 16/09/2026 com grep em todo o repo). Era ruído.
# - `upstream-stable` nunca dispara este workflow: é espelho do upstream e não
#   recebe commit nosso.
# - Armadilha conhecida: `paths-ignore` + "status check obrigatório" na
#   proteção de `main`. Um PR só de documentação não dispara o CI e o check
#   fica "aguardando" para sempre. Se isso acontecer, remover o `paths-ignore`
#   do gatilho `pull_request` (ou não exigir o check).
# - GitHub Actions não suporta âncoras YAML, por isso a lista de
#   `paths-ignore` está duplicada nos dois gatilhos.
# - Bases de assinaturas (entrega 1.6, 25/09/2026): o build normal não tem
#   chave nenhuma e tem de passar (o app recusa atualizar: falha fechada). Duas
#   travas conferem o resto: o release sem o anel de produção é recusado pela
#   guarda de app/build.gradle, e um debug com chave de teste efêmera (gerada
#   no runner, nunca versionada) embute o anel no recurso gerado.

name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'fastlane/**'
      - 'graphics/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitignore'
      - '.github/CODEOWNERS'
      - '.github/dependabot.yml'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'fastlane/**'
      - 'graphics/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitignore'
      - '.github/CODEOWNERS'
      - '.github/dependabot.yml'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: read

# Um push novo no mesmo branch/PR cancela o run anterior ainda em andamento.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build de debug, lint, testes e SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: JDK 17 (Temurin) com cache do Gradle
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build de debug, lint e testes de unidade (JVM)
        # Sem `-DskipFormatKtlint` — ver cabeçalho.
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest --stacktrace

      - name: Trava — targetSdk 36 e alinhamento de 16 KB
        # Entrega 1.2 (matriz permissões × Play, seção target-api-36, testes T1 e
        # T11). A Play exige targetSdk 36 de apps novos desde 31/08/2026 e páginas
        # de 16 KB nas atualizações a partir de 01/02/2027. Hoje o APK não tem
        # biblioteca nativa; se um dia tiver, o zipalign confere o alinhamento.
        run: |
          set -euo pipefail
          apk="$(ls app/build/outputs/apk/debug/*.apk | head -n1)"
          tools="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)"
          target="$("${tools}aapt2" dump badging "$apk" | sed -n "s/^targetSdkVersion:'\([0-9]*\)'.*/\1/p")"
          echo "targetSdkVersion=${target}"
          if [ "$target" != "36" ]; then
            echo "::error::targetSdkVersion ${target}; a Play exige 36"
            exit 1
          fi
          if unzip -Z1 "$apk" | grep -E '^lib/.*\.so$'; then
            "${tools}zipalign" -c -P 16 -v 4 "$apk"
          else
            echo "Sem biblioteca nativa no APK."
          fi

      - name: Trava — release sem chave das bases é recusado
        # Entrega 1.6 (protocolo v1 das bases, seção 5; D-AV18): um APK de release
        # que não confia em chave nenhuma não pode sair. Enquanto o anel de
        # produção não existir (a chave é do André, entrega 2.6), o release TEM de
        # ser recusado pela guarda de app/build.gradle, e por esse motivo. Com o
        # anel no repositório, a trava deixa de se aplicar.
        run: |
          set -uo pipefail
          if [ -f app/src/main/res/raw/fortisafe_bases_chaves.asc ]; then
            echo "Anel de produção presente; a trava não se aplica."
            exit 0
          fi
          if ./gradlew assembleRelease --dry-run > "$RUNNER_TEMP/release-sem-chave.log" 2>&1; then
            cat "$RUNNER_TEMP/release-sem-chave.log"
            echo "::error::o build de release passou sem as chaves das bases (D-AV18)"
            exit 1
          fi
          if ! grep -q "Build de release recusado" "$RUNNER_TEMP/release-sem-chave.log"; then
            cat "$RUNNER_TEMP/release-sem-chave.log"
            echo "::error::o release falhou, mas não pela guarda das bases"
            exit 1
          fi
          echo "Release recusado pela guarda das bases, como esperado."

      - name: SBOM CycloneDX 1.5 a partir de gradle/verification-metadata.xml
        # python3 vem pré-instalado na imagem ubuntu-latest; o script usa só a
        # biblioteca padrão. O que o SBOM cobre e não cobre: scripts/README-sbom.md.
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 scripts/sbom_from_verification_metadata.py \
            --output dist/fortisafe-antivirus-android.cdx.json

      - name: Reunir APK de debug e gerar SHA256SUMS.txt
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/*.apk dist/
          (cd dist && sha256sum -- * > ../SHA256SUMS.txt && mv ../SHA256SUMS.txt .)
          echo "::notice title=SHA-256::$(tr '\n' ' ' < dist/SHA256SUMS.txt)"
          ls -la dist

      - name: Artefato — APK de debug, SBOM e SHA256SUMS.txt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fortisafe-antivirus-android-debug
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Artefato — relatórios de lint e de testes
        # Sobe mesmo se o build falhar (mas não se o run foi cancelado), para
        # que o relatório de lint/teste que causou a falha fique disponível.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relatorio-lint-e-testes
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Trava — debug com chave de teste embute o anel (protocolo v1, seção 8)
        # Roda por último: recompila o debug com outras propriedades depois que o
        # APK normal já foi para o artefato. Exercita fortisafe.bases.chaves,
        # .fingerprints e .url, que o build normal (sem chave) não percorre. A
        # chave Ed25519 é gerada aqui, efêmera, e só a pública entra no APK de
        # teste; nada sobe como artefato.
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"
          gpg --batch --pinentry-mode loopback --passphrase '' \
            --quick-gen-key 'Teste CI FortiSafe <teste@fortisafe.invalid>' ed25519 sign 1d
          fp="$(gpg --batch --with-colons --list-keys | awk -F: '/^fpr:/ {print $10; exit}')"
          gpg --batch --armor --export "$fp" > "$RUNNER_TEMP/chave-teste.asc"
          ./gradlew assembleDebug --stacktrace \
            -Pfortisafe.bases.chaves="$RUNNER_TEMP/chave-teste.asc" \
            -Pfortisafe.bases.fingerprints="$fp" \
            -Pfortisafe.bases.url=http://10.0.2.2:8080/v1/
          apk="$(ls app/build/outputs/apk/debug/*.apk | head -n1)"
          unzip -Z1 "$apk" > "$RUNNER_TEMP/conteudo-apk.txt"
          if ! grep -qx 'res/raw/fortisafe_bases_chaves_debug.asc' "$RUNNER_TEMP/conteudo-apk.txt"; then
            echo "::error::o APK de debug não traz o anel de teste (raw/fortisafe_bases_chaves_debug)"
            exit 1
          fi
          echo "Anel de teste embutido no APK de debug (impressão digital $fp)."
          rm -rf "$GNUPGHOME" "$RUNNER_TEMP/chave-teste.asc"
